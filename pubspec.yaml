name: face_swap_prank_app
version: 1.0.0
description: A mobile app for real-time face swapping and fake video calls for entertainment purposes.
environment:
  sdk: ">=2.17.0 <3.0.0"
dependencies:
  flutter:
    sdk: flutter
  camera: ^0.10.5+2
  image_picker: ^1.0.7
  image: ^4.0.17
  video_player: ^2.7.0
  share_plus: ^7.2.1
  mediapipe: ^0.0.4 # Community plugin, may require platform setup
  path_provider: ^2.1.2
  permission_handler: ^11.3.0
  flutter_local_notifications: ^16.3.0
  provider: ^6.1.2
  cupertino_icons: ^1.0.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
flutter:
  uses-material-design: true
  assets:
    - assets/faces/
    - assets/videos/
    - assets/ringtones/